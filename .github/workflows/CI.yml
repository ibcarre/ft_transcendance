# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches:
      - master
      - dev
  pull_request:
    branches: 
      - master
      - dev

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
# ------------------------- JOB 1: Ubuntu + docker (build and dev) ------------
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create secrets
        run: | 
          mkdir secrets
          echo "${{ secrets.API_KEY }}" > secrets/API_KEY.txt
          echo "${{ secrets.DATABASE_URL }}" > secrets/DATABASE_URL.txt
          echo "${{ secrets.GF_SMTP_PASSWORD }}" > secrets/GF_SMTP_PASSWORD.txt
          echo "${{ secrets.GRAFANA_ADMIN_PASSWORD }}" > secrets/GRAFANA_ADMIN_PASSWORD.txt
          echo "${{ secrets.JWT_SECRETKEY }}" > secrets/JWT_SECRETKEY.txt
          echo "${{ secrets.POSTGRES_PASSWORD }}" > secrets/POSTGRES_PASSWORD.txt
          cp ./srcs/.env.example ./srcs/.env
          # cp ./tools/ci-setup.sh ./tools/podman-sock.sh

      - name: Make (Docker)
        run: make ci

# ------------------------- JOB 2: Fedora 44 + Podman (build and dev) ------------
  test-podman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman + dependencies
        run: |
          sudo apt-get update 
          sudo apt-get install -y podman podman-compose

      - name: Create secrets
        run: | 
          mkdir secrets
          echo "${{ secrets.API_KEY }}" > secrets/API_KEY.txt
          echo "${{ secrets.DATABASE_URL }}" > secrets/DATABASE_URL.txt
          echo "${{ secrets.GF_SMTP_PASSWORD }}" > secrets/GF_SMTP_PASSWORD.txt
          echo "${{ secrets.GRAFANA_ADMIN_PASSWORD }}" > secrets/GRAFANA_ADMIN_PASSWORD.txt
          echo "${{ secrets.JWT_SECRETKEY }}" > secrets/JWT_SECRETKEY.txt
          echo "${{ secrets.POSTGRES_PASSWORD }}" > secrets/POSTGRES_PASSWORD.txt
          cp ./srcs/.env.example ./srcs/.env

      - name: Start Podman API socket
        run: |
          podman system service --time=0 unix:///run/podman/podman.sock &
          for i in $(seq 1 30); do
            if curl -s --unix-socket /run/podman/podman.sock \
              http://d/v1.0.0/libpod/_ping >/dev/null; then
              echo "Podman API is ready"
              break
            fi
            sleep 1
          done
          test -S /run/podman/podman.sock

      - name: Configure environment
        run: |
          sed -i 's|^CONTAINER=.*|CONTAINER=podman|' srcs/.env
          if grep -q '^SOCKET=' srcs/.env; then
            sed -i 's|^SOCKET=.*|SOCKET=/run/podman/podman.sock|' srcs/.env
          else
            echo 'SOCKET=/run/podman/podman.sock' >> srcs/.env
          fi
          echo "DOCKER_HOST=unix:///run/podman/podman.sock" >> "$GITHUB_ENV"


      - name: Make (Podman)
        run: make ci

