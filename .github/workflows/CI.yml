# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "master" branch
  push:
    branches:
      - master
      - dev
  pull_request:
    branches: 
      - master
      - dev

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
# ------------------------- JOB 1: Ubuntu + docker (build and dev) ------------
  test-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create secrets
        run: | 
          mkdir secrets
          echo "${{ secrets.API_KEY }}" > secrets/API_KEY.txt
          echo "${{ secrets.DATABASE_URL }}" > secrets/DATABASE_URL.txt
          echo "${{ secrets.GF_SMTP_PASSWORD }}" > secrets/GF_SMTP_PASSWORD.txt
          echo "${{ secrets.GRAFANA_ADMIN_PASSWORD }}" > secrets/GRAFANA_ADMIN_PASSWORD.txt
          echo "${{ secrets.JWT_SECRETKEY }}" > secrets/JWT_SECRETKEY.txt
          echo "${{ secrets.POSTGRES_PASSWORD }}" > secrets/POSTGRES_PASSWORD.txt
          cp ./srcs/.env.example ./srcs/.env
          # cp ./tools/ci-setup.sh ./tools/podman-sock.sh

      - name: Make (Docker)
        run: make ci

# ------------------------- JOB 2: Fedora 44 + Podman (build and dev) ------------
  test-podman:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman + dependencies
        run: |
          sudo apt-get update 
          sudo apt-get install -y install -y podman podman-compose uidmap slirp4netns fuse-overlayfs passt

      - name: Configure rootless Podman
        run: |
          set -eux

          id
          podman --version
          podman info
          grep "^$(id -un):" /etc/subuid
          grep "^$(id -un):" /etc/subgid

      - name: Create secrets
        run: | 
          mkdir secrets
          echo "${{ secrets.API_KEY }}" > secrets/API_KEY.txt
          echo "${{ secrets.DATABASE_URL }}" > secrets/DATABASE_URL.txt
          echo "${{ secrets.GF_SMTP_PASSWORD }}" > secrets/GF_SMTP_PASSWORD.txt
          echo "${{ secrets.GRAFANA_ADMIN_PASSWORD }}" > secrets/GRAFANA_ADMIN_PASSWORD.txt
          echo "${{ secrets.JWT_SECRETKEY }}" > secrets/JWT_SECRETKEY.txt
          echo "${{ secrets.POSTGRES_PASSWORD }}" > secrets/POSTGRES_PASSWORD.txt
          cp ./srcs/.env.example ./srcs/.env

      - name: Start rootless Podman socket
        run: |
          set -eux

          export XDG_RUNTIME_DIR="${RUNNER_TEMP}/podman-runtime"
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          mkdir -p "$XDG_RUNTIME_DIR/podman"

          podman system service --time=0 \
            "unix://${XDG_RUNTIME_DIR}/podman/podman.sock" \
            > "$RUNNER_TEMP/podman-service.log" 2>&1 &

          echo $! > "$RUNNER_TEMP/podman-service.pid"
          echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          echo "DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock" >> "$GITHUB_ENV"

          for i in $(seq 1 30); do
            if test -S "$XDG_RUNTIME_DIR/podman/podman.sock"; then
              break
            fi
            sleep 1
          done

          if ! test -S "$XDG_RUNTIME_DIR/podman/podman.sock"; then
            cat "$RUNNER_TEMP/podman-service.log"
            exit 1
          fi

          podman info

      - name: Make (Podman)
        run: make ci

