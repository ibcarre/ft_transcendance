services:
  postgres:

  nginx:

  backend:
    build:
      context: ./backend/
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./backend/:/app
      - back-node_modules:/app/node_modules
  
  frontend:
    build:
      context: ./frontend/
      dockerfile: ./Dockerfile.dev
    volumes:
      - ./frontend/:/app
      - front-node_modules:/app/node_modules

volumes:
  front-node_modules:
  back-node_modules:
