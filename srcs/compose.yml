services:

  postgres:
    image: docker.io/library/postgres:18
    container_name: postgres_skyjo
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init_sql/01_schema.sql:/docker-entrypoint-initdb.d/01_tables.sql
    networks:
      - NW_skyjo

  backend:
    build: ./backend/
    container_name: back_skyjo
    restart: unless-stopped
    # healthcheck:
    #   test: ["CMD-SHELL", "sh -c curl"]
    depends_on:
      postgres:
        condition: service_healthy
        restart: true
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      JWT_SECRETKEY: ${JWT_SECRETKEY}
      API_KEY: ${API_KEY}
    networks:
      - NW_skyjo

  frontend:
    build: ./frontend/
    container_name: front_skyjo
    depends_on:
      - backend
    networks:
      - NW_skyjo

  nginx:
    build: ./infra/nginx/
    container_name: nginx_skyjo
    depends_on:
      - frontend
    ports:
      - "${APP_PORT}:443"
    networks:
      - NW_skyjo

  prometheus:
    container_name: prometheus_skyjo
    image: docker.io/prom/prometheus:v3.15.0-rc.0-distroless
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - NW_skyjo
    restart: unless-stopped

  prometheus-health:
    container_name: prom_health
    image: docker.io/library/busybox:1.37
    command: ["sleep", "infinity"]
    network_mode: "service:prometheus"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      - alloy


  grafana:
    image: docker.io/grafana/grafana:13.0.9
    container_name: grafana_skyjo
    depends_on:
      loki:
        condition: service_healthy
    #   prometheus:
    #     condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_HTTP_ADDR: 0.0.0.0
      GF_SERVER_PROTOCOL: http
      GF_SERVER_HTTP_PORT: 3000
      GF_SERVER_DOMAIN: localhost
      GF_SERVER_ROOT_URL: https://localhost:${APP_PORT}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: true
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - NW_skyjo


  loki-init:
    container_name: loki_init
    image: docker.io/library/busybox:1.37
    user: "0"
    command: ["sh", "-c", "mkdir -p /tmp/loki && chown -R 10001:10001 /tmp/loki"]
    volumes:
      - loki_storage:/tmp/loki

  loki:
    container_name: loki_skyjo
    image: docker.io/grafana/loki:3.7.8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    volumes:
      - loki_storage:/tmp/loki
      - ./infra/loki/loki.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - NW_skyjo

  alloy:
    container_name: alloy_skyjo
    image: docker.io/grafana/alloy:v1.20.1-distroless
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
        restart: true
    volumes:
      - ./infra/alloy:/etc/alloy:ro
      - ${SOCKET}:/var/run/docker.sock:ro
    networks:
      - NW_skyjo
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345

  alloy-health:
    container_name: alloy_health
    image: docker.io/library/busybox:1.37
    command: ["sleep", "infinity"]
    network_mode: "service:alloy"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:12345/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s
    depends_on:
      - alloy

volumes:
  postgres_data:
  grafana_storage:
  loki_storage:

networks:
  NW_skyjo:
