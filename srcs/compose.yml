

services:

  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - NW_skyjo



volumes:
  postgres_data:

networks:
  NW_skyjo:
