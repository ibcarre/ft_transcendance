services:

  postgres:
    image: docker.io/library/postgres:18
    container_name: postgres_skyjo
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infra/postgres/init_sql/01_schema.sql:/docker-entrypoint-initdb.d/01_tables.sql
    networks:
      - NW_skyjo

  backend:
    build: ./backend/
    container_name: back_skyjo
    depends_on:
      - postgres
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      JWT_SECRETKEY: ${JWT_SECRETKEY}
    networks:
        - NW_skyjo

  frontend:
    build: ./frontend/
    container_name: front_skyjo
    depends_on:
      - backend
    networks:
      - NW_skyjo

  nginx:
    build: ./infra/nginx/
    container_name: nginx_skyjo
    depends_on:
      - frontend
    ports:
      - "${APP_PORT}:443"
    networks:
      - NW_skyjo

  prometheus:
    container_name: prometheus_skyjo
    image: docker.io/prom/prometheus:v3.15.0-rc.0-distroless
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - NW_skyjo
    restart: unless-stopped

  grafana:
    image: docker.io/grafana/grafana:13.0.9
    container_name: grafana_skyjo
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana_storage:/var/lib/grafana
      - ./infra/grafana/provising:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - NW_skyjo


  loki-init:
    image: docker.io/library/busybox:1.37
    user: "0"
    command: ["sh", "-c", "mkdir -p /tmp/loki && chown -R 10001:10001 /tmp/loki"]
    volumes:
      - loki_storage:/tmp/loki

  loki:
    container_name: loki_skyjo
    image: docker.io/grafana/loki:3.7.8
    volumes:
      - loki_storage:/tmp/loki
      - ./infra/loki/loki.yaml:/etc/loki/local-config.yaml:ro
    networks:
        - NW_skyjo

  alloy:
    container_name: alloy_skyjo
    image: docker.io/grafana/alloy:v1.20.1 #-distroless
    volumes:
      - ./infra/alloy:/etc/alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    networks:
      - NW_skyjo

volumes:
  postgres_data:
  grafana_storage:
  loki_storage:

networks:
  NW_skyjo:
