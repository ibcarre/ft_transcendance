apiVersion: 1
contactPoints:
    - orgId: 1
      name: mail-devops
      receivers:
        - uid: fg15tp4jiyv40b
          type: email
          settings:
            addresses: paris@student.42.fr
            message: |-
                {{ range .Alerts }}
                *{{ .Annotations.summary }}*

                {{ .Annotations.description }}

                • Job : {{ .Labels.job }}
                • Instance : {{ .Labels.instance }}
                • Severity : {{ .Labels.severity }}
                {{ end }}
            singleEmail: true
            subject: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} - {{ .CommonLabels.job }}'
          disableResolveMessage: false
