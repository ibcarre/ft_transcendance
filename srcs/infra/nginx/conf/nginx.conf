http {
    include /etc/nginx/mime.types;

    server {
        listen 443 ssl;
        listen [::]:443 ssl;

        server_name skyjo.42.fr;

        ssl_certificate     /etc/nginx/ssl/inception.crt;
        ssl_certificate_key /etc/nginx/ssl/inception.key;
        ssl_protocols       TLSv1.3;

        error_page 497 https://localhost:44443$request_uri;

        location / {
            proxy_pass http://frontend:5173;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

		location /grafana {
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_pass http://grafana:3000;
		}

		location = /dashboard {
			return 301 https://$http_host/grafana/d/skyjo;
		}

		location /grafana {
			proxy_http_version 1.1;
			proxy_set_header Host $http_host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
			proxy_pass http://grafana:3000;
		}

		location = /dashboard {
			return 301 https://$http_host/grafana/d/skyjo;
		}

		location = /logs {
			return 301 https://$http_host/grafana/a/grafana-lokiexplore-app;
		}

		location /socket.io/ {
			proxy_pass http://localhost:3000;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_set_header Host $host;
        location /socket.io/ {
            proxy_pass http://backend:5000;

            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

			# Additional settings to fine-tune your setup
			proxy_buffering off;
			proxy_redirect off;
			proxy_connect_timeout 90s;
			proxy_send_timeout 90s;
			proxy_read_timeout 90s;
    	}


		# location /ws {
		# 	#backend:3001 via socket (real time)
		#       }

		# location /uploads/ {
		# 	# avatar
		#       }
	}
}

events {}
