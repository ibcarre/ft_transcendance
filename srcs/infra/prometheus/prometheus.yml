global:
  scrape_interval: 15s
 
scrape_configs:
  - job_name: 'Prometheus'
    static_configs:
      - targets: ['localhost:9090']
  - job_name: 'Backend'
    static_configs:
      - targets: ['backend:5000']
  - job_name: 'Alloy'
    static_configs:
      - targets: ['alloy:12345']
